<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业主端小程序V2.0-线上商城 - 原型注解</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #F5F5F5;
            overflow: hidden;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 220px;
            background: linear-gradient(180deg, #353B3C 0%, #2C3132 100%);
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .sidebar-header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #FFFFFF;
        }
        
        .sidebar-header p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 4px;
        }
        
        .menu-section {
            padding: 4px 0;
        }
        
        .menu-title {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            padding: 8px 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .menu-group {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .menu-item {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            position: relative;
        }
        
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .menu-item.active {
            background: rgba(70, 193, 255, 0.2);
            color: #46C1FF;
            border-left: 3px solid #46C1FF;
        }
        
        .menu-item i {
            width: 18px;
            margin-right: 10px;
            font-size: 14px;
        }
        
        .menu-item.expandable {
            justify-content: space-between;
        }
        
        .menu-item.expandable > span:first-of-type {
            display: flex;
            align-items: center;
        }
        
        .menu-item .expand-icon {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
            margin-left: auto;
        }
        
        .menu-item.expandable.expanded .expand-icon {
            transform: rotate(90deg);
        }
        
        .sub-menu {
            background: rgba(0, 0, 0, 0.25);
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
        }
        
        .sub-menu.expanded {
            max-height: 500px;
        }
        
        .sub-menu .menu-item {
            padding-left: 48px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.75);
            border-left: none;
        }
        
        .sub-menu .menu-item.active {
            background: rgba(70, 193, 255, 0.15);
            color: #46C1FF;
            border-left: 2px solid #46C1FF;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .prototype-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
            background: #E8E8E0;
        }
        
        .breadcrumb {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
            color: #666;
        }
        
        .breadcrumb span {
            margin: 0 4px;
            color: #999;
        }
        
        .breadcrumb a {
            color: #46C1FF;
            text-decoration: none;
        }
        
        .page-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .page-tab {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        
        .page-tab.active {
            background: #353B3C;
            color: #FFFFFF;
        }
        
        .page-tab:not(.active) {
            background: #FFFFFF;
            color: #666;
            border-color: #E5E5E5;
        }
        
        .page-tab:not(.active):hover {
            border-color: #46C1FF;
            color: #46C1FF;
        }
        
        .mobile-frame {
            width: 390px;
            height: 844px;
            background: #FFFFFF;
            border-radius: 24px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.15);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .mobile-status-bar {
            height: 44px;
            background: #FFFFFF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }
        
        .mobile-status-bar .time {
            font-size: 15px;
        }
        
        .mobile-status-bar .icons {
            display: flex;
            gap: 8px;
            font-size: 14px;
        }
        
        .mobile-header {
            height: 44px;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #F5F5F5;
            flex-shrink: 0;
        }
        
        .mobile-header-title {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }
        
        .mobile-content {
            flex: 1;
            overflow-y: auto;
            background: #F7F7F7;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .page-placeholder {
            text-align: center;
            color: #999;
        }
        
        .page-placeholder i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .page-placeholder h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #666;
        }
        
        .page-placeholder p {
            font-size: 13px;
            line-height: 1.6;
        }
        
        .mobile-bottom-nav {
            height: 49px;
            background: #FFFFFF;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #F5F5F5;
            padding-bottom: env(safe-area-inset-bottom);
            flex-shrink: 0;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #999;
            cursor: pointer;
            padding: 6px 16px;
        }
        
        .nav-item.active {
            color: #46C1FF;
        }
        
        .nav-item i {
            font-size: 20px;
        }
        
        .description-panel {
            width: 420px;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.05);
        }
        
        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid #F5F5F5;
            background: #F7F8FA;
        }
        
        .panel-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        
        .panel-tabs {
            display: flex;
            border-bottom: 1px solid #E5E5E5;
        }
        
        .panel-tab {
            padding: 12px 20px;
            font-size: 13px;
            cursor: pointer;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .panel-tab.active {
            color: #46C1FF;
            border-bottom-color: #46C1FF;
            font-weight: 500;
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        
        .doc-section {
            margin-bottom: 24px;
        }
        
        .doc-section-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            padding-left: 8px;
            border-left: 3px solid #46C1FF;
        }
        
        .doc-section p {
            font-size: 13px;
            line-height: 1.8;
            color: #666;
            margin-bottom: 8px;
        }
        
        .doc-section ul {
            list-style: none;
            padding-left: 0;
        }
        
        .doc-section li {
            font-size: 13px;
            line-height: 1.8;
            color: #666;
            padding-left: 20px;
            position: relative;
            margin-bottom: 6px;
        }
        
        .doc-section li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #46C1FF;
        }
        
        /* ====== 交互注释：编号卡片 ====== */
        .interaction-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .interaction-card {
            background: #F9FAFB;
            border-radius: 8px;
            padding: 14px 16px;
            border-left: 3px solid #46C1FF;
            transition: all 0.2s;
        }
        
        .interaction-card:hover {
            background: #F0F7FF;
            transform: translateX(2px);
        }
        
        .interaction-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        
        .interaction-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #46C1FF;
            color: #FFFFFF;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .interaction-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            flex: 1;
        }
        
        .interaction-tag {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }
        
        .interaction-tag.interaction {
            background: #E3F2FD;
            color: #1976D2;
        }
        
        .interaction-tag.state {
            background: #FFF3E0;
            color: #F57C00;
        }
        
        .interaction-content {
            font-size: 12px;
            line-height: 1.7;
            color: #666;
            padding-left: 28px;
        }
        
        .interaction-content p {
            margin-bottom: 4px;
        }
        
        /* ====== 需求文档：PRD 结构 ====== */
        .prd-header {
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #E5E5E5;
        }
        
        .prd-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }
        
        .prd-meta {
            font-size: 11px;
            color: #999;
        }
        
        .prd-section {
            margin-bottom: 20px;
        }
        
        .prd-section-title {
            font-size: 13px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            padding-left: 8px;
            border-left: 3px solid #353B3C;
        }
        
        .prd-section p {
            font-size: 12px;
            line-height: 1.8;
            color: #555;
            margin-bottom: 6px;
        }
        
        .prd-flow {
            background: #F9F9F9;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #555;
            line-height: 1.8;
            text-align: center;
        }
        
        .prd-flow .arrow {
            color: #46C1FF;
            margin: 0 6px;
            font-weight: 600;
        }
        
        .prd-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 4px;
        }
        
        .prd-table th {
            background: #F5F5F5;
            color: #333;
            font-weight: 600;
            padding: 8px 10px;
            text-align: left;
            border: 1px solid #E5E5E5;
        }
        
        .prd-table td {
            padding: 8px 10px;
            color: #555;
            border: 1px solid #E5E5E5;
            line-height: 1.6;
            vertical-align: top;
        }
        
        .prd-table td code {
            background: #F0F7FF;
            color: #1976D2;
            padding: 1px 4px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 11px;
        }
        
        .prd-code {
            background: #2C3132;
            color: #E5E5E5;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 11px;
            line-height: 1.7;
            overflow-x: auto;
            white-space: pre;
        }
        
        .prd-warn {
            background: #FFF8E1;
            border-left: 3px solid #FFB300;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #7B5E00;
            line-height: 1.7;
        }
        
        /* ====== 状态清单：表格 ====== */
        .status-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        
        .status-table th {
            background: #353B3C;
            color: #FFFFFF;
            font-weight: 600;
            padding: 10px 8px;
            text-align: left;
            border: 1px solid #2C3132;
            font-size: 11px;
        }
        
        .status-table td {
            padding: 8px;
            color: #555;
            border: 1px solid #E5E5E5;
            line-height: 1.6;
            vertical-align: top;
        }
        
        .status-table tr:nth-child(even) td {
            background: #F9FAFB;
        }
        
        .status-table .block-name {
            font-weight: 600;
            color: #333;
        }
        
        .status-table .ui-cell code {
            background: #F0F7FF;
            color: #1976D2;
            padding: 1px 4px;
            border-radius: 3px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 11px;
        }
        
        @media (max-width: 1200px) {
            .description-panel {
                width: 360px;
            }
        }
        
        @media (max-width: 1000px) {
            .sidebar {
                width: 180px;
            }
            
            .description-panel {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>业主端小程序V2.0</h1>
                <p>线上商城 · 原型注解</p>
            </div>
            
            <div class="menu-section">
                <div class="menu-title">主导航</div>
                
                <div class="menu-group">
                    <div class="menu-item expandable expanded" data-page="shop">
                        <span>
                            <i class="fa fa-shopping-bag"></i>
                            <span>商城</span>
                        </span>
                        <i class="fa fa-chevron-right expand-icon"></i>
                    </div>
                    <div class="sub-menu expanded">
                        <div class="menu-item active" data-subpage="shop-home">
                            <i class="fa fa-home"></i>
                            <span>商城首页</span>
                        </div>
                        <div class="menu-item" data-subpage="shop-search">
                            <i class="fa fa-search"></i>
                            <span>搜索商品页</span>
                        </div>
                        <div class="menu-item" data-subpage="shop-category">
                            <i class="fa fa-th-large"></i>
                            <span>分类页</span>
                        </div>
                        <div class="menu-item" data-subpage="shop-detail">
                            <i class="fa fa-info-circle"></i>
                            <span>商品详情页</span>
                        </div>
                        <div class="menu-item" data-subpage="shop-cart">
                            <i class="fa fa-shopping-cart"></i>
                            <span>购物车页</span>
                        </div>
                        <div class="menu-item" data-subpage="shop-checkout">
                            <i class="fa fa-file-text"></i>
                            <span>确认订单页</span>
                        </div>
                        <div class="menu-item" data-subpage="shop-orders">
                            <i class="fa fa-list-alt"></i>
                            <span>我的订单页</span>
                        </div>
                    </div>
                </div>
                
                <div class="menu-group">
                    <div class="menu-item expandable" data-page="access">
                        <span>
                            <i class="fa fa-sign-in"></i>
                            <span>通行页</span>
                        </span>
                        <i class="fa fa-chevron-right expand-icon"></i>
                    </div>
                    <div class="sub-menu">
                        <div class="menu-item" data-subpage="access-home">
                            <i class="fa fa-key"></i>
                            <span>通行首页</span>
                        </div>
                        <div class="menu-item" data-subpage="access-face">
                            <i class="fa fa-user-circle"></i>
                            <span>人脸录入</span>
                        </div>
                        <div class="menu-item" data-subpage="access-nfc">
                            <i class="fa fa-credit-card"></i>
                            <span>NFC钥匙</span>
                        </div>
                    </div>
                </div>
                
                <div class="menu-group">
                    <div class="menu-item expandable" data-page="profile">
                        <span>
                            <i class="fa fa-user"></i>
                            <span>我的页</span>
                        </span>
                        <i class="fa fa-chevron-right expand-icon"></i>
                    </div>
                    <div class="sub-menu">
                        <div class="menu-item" data-subpage="profile-home">
                            <i class="fa fa-user-circle"></i>
                            <span>个人中心</span>
                        </div>
                        <div class="menu-item" data-subpage="profile-settings">
                            <i class="fa fa-cog"></i>
                            <span>设置页</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div class="prototype-area">
                <div class="breadcrumb">
                    <a href="#">原型注解</a>
                    <span>&gt;</span>
                    <a href="#" id="breadcrumb-main">商城</a>
                    <span>&gt;</span>
                    <span id="breadcrumb-sub">商城首页</span>
                </div>
                
                <div class="page-tabs" id="page-tabs">
                    <div class="page-tab active" data-tab="shop-home">商城首页</div>
                    <div class="page-tab" data-tab="shop-search">搜索商品页</div>
                    <div class="page-tab" data-tab="shop-category">分类页</div>
                    <div class="page-tab" data-tab="shop-detail">商品详情页</div>
                    <div class="page-tab" data-tab="shop-cart">购物车页</div>
                    <div class="page-tab" data-tab="shop-checkout">确认订单页</div>
                    <div class="page-tab" data-tab="shop-orders">我的订单页</div>
                </div>
                
                <div class="mobile-frame">
                    <div class="mobile-status-bar">
                        <span class="time">9:41</span>
                        <div class="icons">
                            <i class="fa fa-signal"></i>
                            <i class="fa fa-wifi"></i>
                            <i class="fa fa-battery-three-quarters"></i>
                        </div>
                    </div>
                    
                    <div class="mobile-header">
                        <i class="fa fa-chevron-left" style="font-size: 18px; color: #333;"></i>
                        <span class="mobile-header-title" id="mobile-title">商城首页</span>
                        <i class="fa fa-ellipsis-h" style="font-size: 18px; color: #333;"></i>
                    </div>
                    
                    <div class="mobile-content" id="mobile-content">
                        <div class="page-placeholder">
                            <i class="fa fa-shopping-bag"></i>
                            <h3>商城首页</h3>
                            <p>展示商城首页的商品列表、促销活动、轮播图等内容</p>
                        </div>
                    </div>
                    
                    <div class="mobile-bottom-nav">
                        <div class="nav-item active" data-nav="shop">
                            <i class="fa fa-shopping-bag"></i>
                            <span>商城</span>
                        </div>
                        <div class="nav-item" data-nav="access">
                            <i class="fa fa-sign-in"></i>
                            <span>通行</span>
                        </div>
                        <div class="nav-item" data-nav="profile">
                            <i class="fa fa-user"></i>
                            <span>我的</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="description-panel">
                <div class="panel-header">
                    <h2 id="panel-title">商城首页</h2>
                </div>
                
                <div class="panel-tabs">
                    <div class="panel-tab active" data-panel="interaction">交互注释</div>
                    <div class="panel-tab" data-panel="requirement">需求文档</div>
                    <div class="panel-tab" data-panel="status">状态清单</div>
                </div>
                
                <div class="panel-content" id="panel-content">
                    <div id="panel-interaction" class="panel-section"></div>
                    <div id="panel-requirement" class="panel-section" style="display: none;"></div>
                    <div id="panel-status" class="panel-section" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ====== 页面数据：交互注释 + 需求文档 + 状态清单 ======
        const pages = {
            'shop-home': {
                title: '商城首页',
                mainNav: 'shop',
                placeholder: { icon: 'fa fa-shopping-bag', title: '商城首页', desc: '展示商城首页的商品列表、促销活动、轮播图等内容' },
                interactionNotes: [
                    { id: 1, title: '顶部搜索框', type: 'interaction', content: '点击搜索框 → 跳转至「搜索商品页」\n支持输入关键词、历史记录、热门搜索' },

                interactionNotes: [
                    { id: 1, title: '用户信息', type: 'interaction', content: '展示头像、昵称、手机号\n点击 → 跳转「个人信息编辑页」' },
                    { id: 2, title: '订单快捷入口', type: 'interaction', content: '展示订单各状态快捷入口\n点击 → 跳转「我的订单页」对应状态' },
                    { id: 3, title: '功能列表', type: 'interaction', content: '优惠券、地址管理、设置等入口\n点击 → 跳转对应页面' }

                requirementDoc: {

                    { block: '头像', state: '已设置', trigger: '已上传头像', ui: '展示用户头像' }

                mainNav: 'profile',
                placeholder: { icon: 'fa fa-cog', title: '设置页', desc: '账号设置、通知设置、关于等功能' },
                interactionNotes: [
                    { id: 1, title: '设置项列表', type: 'interaction', content: '点击各设置项 → 跳转对应二级页面\n包含：账号、通知、隐私、关于' },
                    { id: 2, title: '退出登录', type: 'interaction', content: '点击「退出登录」→ 二次确认弹窗\n确认后清除登录态，返回登录页' }
                ],
                requirementDoc: {

                    meta: 'v1.0 · 业主端小程序 · 2026-07',
                    sections: [

                statusList: [

                    { block: '退出弹窗', state: '显示', trigger: '点击退出', ui: '遮罩 + 二次确认' }
                ]

        // ====== 渲染：交互注释 ======
        function renderInteractionNotes(notes) {
            if (!notes || notes.length === 0) return '<p style="color:#999;font-size:12px;">暂无交互注释</p>';
            return `
                <div class="interaction-list">
                    ${notes.map(note => `
                        <div class="interaction-card">
                            <div class="interaction-card-header">
                                <span class="interaction-num">${note.id}</span>
                                <span class="interaction-title">${note.title}</span>
                                <span class="interaction-tag ${note.type}">${note.type === 'interaction' ? '交互' : '状态'}</span>
                            </div>
                            <div class="interaction-content">
                                ${note.content.split('\n').map(line => `<p>${line}</p>`).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // ====== 渲染：需求文档 ======
        function renderRequirementDoc(doc) {
            if (!doc) return '<p style="color:#999;font-size:12px;">暂无需求文档</p>';
            return `
                <div class="prd-header">
                    <div class="prd-title">${doc.title}</div>
                    <div class="prd-meta">${doc.meta}</div>
                </div>
                ${doc.sections.map(section => `
                    <div class="prd-section">
                        <div class="prd-section-title">${section.title}</div>
                        ${section.paragraphs ? section.paragraphs.map(p => `<p>${p}</p>`).join('') : ''}
                        ${section.flow ? `<div class="prd-flow">${section.flow}</div>` : ''}
                        ${section.table ? renderTable(section.table) : ''}
                        ${section.code ? `<pre class="prd-code">${section.code}</pre>` : ''}
                        ${section.warn ? `<div class="prd-warn">${section.warn}</div>` : ''}
                    </div>
                `).join('')}
            `;
        }
        
        function renderTable(table) {
            return `
                <table class="prd-table">
                    <thead>
                        <tr>${table.headers.map(h => `<th>${h}</th>`).join('')}</tr>
                    </thead>
                    <tbody>
                        ${table.rows.map(row => `
                            <tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        // ====== 渲染：状态清单 ======
        function renderStatusList(list) {
            if (!list || list.length === 0) return '<p style="color:#999;font-size:12px;">暂无状态清单</p>';
            return `
                <table class="status-table">
                    <thead>
                        <tr>
                            <th>区块</th>
                            <th>状态</th>
                            <th>触发条件</th>
                            <th>UI 表现</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${list.map(item => `
                            <tr>
                                <td class="block-name">${item.block}</td>
                                <td>${item.state}</td>
                                <td>${item.trigger}</td>
                                <td class="ui-cell">${item.ui}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        // ====== 切换页面 ======
        function switchPage(pageId) {
            const page = pages[pageId];
            if (!page) return;
            
            document.querySelectorAll('.menu-item[data-subpage]').forEach(item => item.classList.remove('active'));
            document.querySelectorAll(`[data-subpage="${pageId}"]`).forEach(item => item.classList.add('active'));
            
            document.querySelectorAll('.page-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll(`[data-tab="${pageId}"]`).forEach(tab => tab.classList.add('active'));
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll(`[data-nav="${page.mainNav}"]`).forEach(item => item.classList.add('active'));
            
            document.getElementById('breadcrumb-main').textContent = 
                page.mainNav === 'shop' ? '商城' : 
                page.mainNav === 'access' ? '通行页' : '我的页';
            document.getElementById('breadcrumb-sub').textContent = page.title;
            
            document.getElementById('mobile-title').textContent = page.title;
            document.getElementById('panel-title').textContent = page.title;
            
            const placeholder = page.placeholder;
            document.getElementById('mobile-content').innerHTML = `
                <div class="page-placeholder">
                    <i class="${placeholder.icon}"></i>
                    <h3>${placeholder.title}</h3>
                    <p>${placeholder.desc}</p>
                </div>
            `;
            
            document.getElementById('panel-interaction').innerHTML = renderInteractionNotes(page.interactionNotes);
            document.getElementById('panel-requirement').innerHTML = renderRequirementDoc(page.requirementDoc);
            document.getElementById('panel-status').innerHTML = renderStatusList(page.statusList);
        }
        
        function switchPanel(panelName) {
            document.querySelectorAll('.panel-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll(`[data-panel="${panelName}"]`).forEach(tab => tab.classList.add('active'));
            
            document.querySelectorAll('.panel-section').forEach(section => section.style.display = 'none');
            document.getElementById(`panel-${panelName}`).style.display = 'block';
        }
        
        // ====== 事件绑定 ======
        document.querySelectorAll('.menu-item[data-subpage]').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                switchPage(item.dataset.subpage);
            });
        });
        
        document.querySelectorAll('.page-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                switchPage(tab.dataset.tab);
            });
        });
        
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const pageMap = { 'shop': 'shop-home', 'access': 'access-home', 'profile': 'profile-home' };
                switchPage(pageMap[item.dataset.nav]);
            });
        });
        
        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                switchPanel(tab.dataset.panel);
            });
        });
        
        document.querySelectorAll('.menu-item.expandable').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const subMenu = item.nextElementSibling;
                const isExpanded = item.classList.contains('expanded');
                
                if (isExpanded) {
                    item.classList.remove('expanded');
                    if (subMenu && subMenu.classList.contains('sub-menu')) {
                        subMenu.classList.remove('expanded');
                    }
                } else {
                    item.classList.add('expanded');
                    if (subMenu && subMenu.classList.contains('sub-menu')) {
                        subMenu.classList.add('expanded');
                    }
                    const page = item.dataset.page;
                    if (page) {
                        const pageMap = { 'shop': 'shop-home', 'access': 'access-home', 'profile': 'profile-home' };
                        switchPage(pageMap[page]);
                    }
                }
            });
        });
        
        function expandParentMenu(pageId) {
            const subMenuItem = document.querySelector(`[data-subpage="${pageId}"]`);
            if (subMenuItem) {
                const subMenu = subMenuItem.closest('.sub-menu');
                if (subMenu) {
                    subMenu.classList.add('expanded');
                    const expandableItem = subMenu.previousElementSibling;
                    if (expandableItem && expandableItem.classList.contains('expandable')) {
                        expandableItem.classList.add('expanded');
                    }
                }
            }
        }
        
        const _originalSwitchPage = switchPage;
        switchPage = function(pageId) {
            expandParentMenu(pageId);
            _originalSwitchPage(pageId);
        };
        
        // ====== 初始化：渲染默认页面 ======
        switchPage('shop-home');
    </script>
</body>
</html>
