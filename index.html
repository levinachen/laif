<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业主端小程序V2.0-线上商城 - 原型注解</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        /* ====== Design Tokens（参考 laif-face-access 风格）====== */
        :root {
            --primary:   #353B3C;             /* 主色 - 深灰近黑（参考页 primary）*/
            --accent:    #7F77DD;             /* 紫色 accent（参考页）*/
            --accent-soft: #EEEEFF;           /* 浅紫底 */
            --accent-soft-2: #F8F8FB;         /* 更浅紫底（卡片头部/表头）*/
            --nav-active: rgb(183, 168, 240); /* 导航栏按钮选中色 - 浅紫 */
            --danger:    #D63E39;
            --success:   #07C160;
            --warning:   #FA8C16;
            --gray1: #333333;
            --gray2: #4F4F4F;
            --gray3: #828282;
            --gray4: #BDBDBD;
            --gray5: #E0E0E0;
            --gray6: #F5F5F5;
            --gray7: #F9F9F9;
            --white:  #FFFFFF;
            --canvas-bg: #EFEFEF;             /* 画布背景 */
            --border: #EBEBEB;
            --panel-bg: #FAFAFA;
            --font: 'PingFang SC', -apple-system, 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', Menlo, monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--canvas-bg);
            overflow: hidden;
            color: var(--gray1);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .app-container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 220px;
            background: #1C1C1E;
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }

        .sidebar-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .sidebar-header h1 {
            font-size: 14px;
            font-weight: 600;
            color: #FFFFFF;
            letter-spacing: 0.2px;
        }

        .sidebar-header p {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
            font-family: var(--font-mono);
            letter-spacing: 0.3px;
        }

        .menu-section {
            padding: 4px 0;
        }

        .menu-title {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            padding: 14px 20px 6px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .menu-group {
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .menu-group:last-child { border-bottom: none; }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 9px 20px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            position: relative;
            border-left: 2px solid transparent;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #FFFFFF;
        }

        .menu-item.active {
            background: rgba(124, 92, 252, 0.12);
            color: var(--nav-active);
            border-left: 2px solid var(--nav-active);
        }

        .menu-item.active i { color: var(--nav-active); }

        .menu-item i {
            width: 16px;
            margin-right: 10px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.15s;
        }

        .menu-item:hover i { color: rgba(255, 255, 255, 0.85); }

        .menu-item.expandable {
            justify-content: space-between;
        }

        .menu-item.expandable > span:first-of-type {
            display: flex;
            align-items: center;
        }

        .menu-item .expand-icon {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            transition: transform 0.25s, color 0.15s;
            margin-left: auto;
        }

        .menu-item.expandable:hover .expand-icon { color: rgba(255, 255, 255, 0.85); }
        .menu-item.expandable.expanded .expand-icon { transform: rotate(90deg); color: var(--accent); }

        .sub-menu {
            background: rgba(0, 0, 0, 0.22);
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.28s ease;
        }

        .sub-menu.expanded {
            max-height: 500px;
        }

        .sub-menu .menu-item {
            padding-left: 36px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.55);
            border-left: none;
        }

        .sub-menu .menu-item::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 50%;
            width: 6px;
            height: 1px;
            background: rgba(255, 255, 255, 0.15);
        }

        .sub-menu .menu-item.active {
            background: rgba(124, 92, 252, 0.12);
            color: var(--nav-active);
            border-left: 2px solid var(--nav-active);
        }
        .sub-menu .menu-item.active::before { background: var(--nav-active); }
        
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .prototype-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 36px 24px;
            overflow-y: auto;
            background: var(--canvas-bg);
            align-items: center;
        }

        .prototype-area::-webkit-scrollbar { width: 6px; height: 6px; }
        .prototype-area::-webkit-scrollbar-thumb { background: var(--gray5); border-radius: 3px; }

        .breadcrumb {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            font-size: 12px;
            color: var(--gray3);
            align-self: flex-start;
            font-family: var(--font-mono);
        }

        .breadcrumb span {
            margin: 0 6px;
            color: var(--gray4);
        }

        .breadcrumb a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .page-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 88px;
            flex-wrap: wrap;
            align-self: flex-start;
        }

        .page-tab {
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #D0D0D0;
            background: rgba(255,255,255,0.7);
            color: var(--gray2);
            white-space: nowrap;
            backdrop-filter: blur(4px);
            font-weight: 500;
        }

        .page-tab.active {
            background: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }

        .page-tab:not(.active):hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── 状态控制器（手机外）── */
        .state-controller {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 88px;
            flex-wrap: wrap;
        }
        .state-controller-label {
            font-size: 12px;
            color: var(--gray3);
            font-family: var(--font-mono);
            margin-right: 4px;
        }
        .state-tab {
            padding: 5px 14px;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid var(--gray5);
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(4px);
            color: var(--gray2);
        }
        .state-tab.active {
            background: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }
        .state-tab:not(.active):hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ── iPhone 真实手机壳 ── */
        .mobile-frame {
            width: 375px;
            height: 812px;
            background: #fff;
            border-radius: 50px;
            box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 11px #2a2a2a, 0 24px 56px rgba(0,0,0,0.4);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .mobile-status-bar {
            height: 47px;
            background: #FFFFFF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px 0;
            font-size: 17px;
            font-weight: 600;
            color: #000;
            flex-shrink: 0;
            font-family: -apple-system, 'Helvetica Neue', sans-serif;
            transition: background 0.2s, color 0.2s;
        }

        /* 个人中心：状态栏叠加在背景图上 */
        .mobile-status-bar.profile {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            background: transparent;
            color: #FFFFFF;
        }
        .mobile-frame:has(.mobile-status-bar.profile) .mobile-content {
            padding-top: 0;
        }

        .mobile-status-bar .time {
            font-size: 15px;
        }

        .mobile-status-bar .icons {
            display: flex;
            gap: 8px;
            font-size: 14px;
        }
        
        .mobile-header {
            height: 41px;
            background: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 16px;
            position: relative;
            flex-shrink: 0;
        }

        .mobile-header-title {
            font-size: 16px;
            font-weight: 500;
            color: #1D1D1D;
        }

        .mobile-content {
            flex: 1;
            overflow-y: auto;
            background: var(--gray7);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .mobile-content::-webkit-scrollbar { display: none; }
        
        .page-placeholder {
            text-align: center;
            color: #999;
        }
        
        .page-placeholder i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .page-placeholder h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #666;
        }
        
        .page-placeholder p {
            font-size: 13px;
            line-height: 1.6;
        }

        /* ====== 商城首页专用样式（v2）====== */
        .mobile-content.custom-render {
            padding: 0;
            display: block;
        }
        .mh-page {
            background: #F2F3F5;
            min-height: 100%;
            position: relative;
            width: 100%;
        }
        .mh-search-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 8px 12px;
        }
        .mh-search-bar {
            flex: 1;
            height: 40px;
            background: #FFFFFF;
            border: 1px solid #F5F5F5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 4px;
            position: relative;
            box-shadow: 0 0 2px 0 rgba(0, 0, 0, 0.04);
        }
        .mh-search-bar .mh-search-icon {
            width: 16px;
            height: 16px;
            color: #828282;
            font-size: 14px;
        }
        .mh-search-bar .mh-search-placeholder {
            color: #828282;
            font-size: 14px;
            flex: 1;
        }
        .mh-search-bar .mh-search-btn {
            position: absolute;
            right: 4px;
            top: 4px;
            width: 64px;
            height: 32px;
            background: #353B3C;
            color: #FFFFFF;
            font-size: 13px;
            border: 1px solid #FFFFFF;
            border-radius: 24px;
            cursor: pointer;
        }
        .mh-cs-icon {
            width: 24px;
            height: 24px;
            color: #353B3C;
            font-size: 20px;
            text-align: center;
            line-height: 24px;
            cursor: pointer;
        }
        .mh-banner {
            margin: 0 12px;
            height: 201px;
            background: #BDBDBD;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }
        .mh-banner .mh-banner-overlay {
            position: absolute;
            left: 24px;
            top: 24px;
            color: #FFFFFF;
            font-size: 24px;
            line-height: 36px;
            font-family: "jiangxizhuokai", "PingFang SC", serif;
            letter-spacing: -0.06em;
            white-space: pre-line;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        .mh-banner .mh-pagination {
            position: absolute;
            bottom: 18px;
            right: 18px;
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 24px;
            letter-spacing: 0.0182em;
        }
        .mh-section {
            padding: 8px 12px;
        }
        .mh-category-grid {
            background: #FFFFFF;
            border-radius: 12px;
            padding: 12px 4px;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            grid-template-rows: 68px 68px;
            gap: 16px 0;
            box-shadow: 0 0 8px 0 rgba(0, 0, 0, 0.02);
        }
        .mh-cat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }
        .mh-cat-icon {
            width: 48px;
            height: 48px;
            background: #DBEAFE;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #353B3C;
            font-size: 18px;
        }
        .mh-cat-label {
            margin-top: 4px;
            font-size: 11px;
            color: #333;
            line-height: 1.2;
        }
        .mh-ranking-row {
            display: flex;
            gap: 8px;
        }
        .mh-ranking-row + .mh-ranking-row {
            margin-top: 8px;
        }
        .mh-ranking-card {
            flex: 1;
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 0 8px 0 rgba(0, 0, 0, 0.02);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .mh-ranking-title {
            font-size: 14px;
            font-weight: 600;
            color: #1D1D1D;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mh-ranking-title .mh-more {
            font-size: 11px;
            color: #828282;
            font-weight: 400;
        }
        .mh-ranking-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }
        .mh-ranking-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mh-ranking-img {
            height: 72.5px;
            background: #E0E0E0;
            border-radius: 6px;
        }
        .mh-ranking-name {
            font-size: 11px;
            color: #333;
            line-height: 1.3;
        }
        .mh-ranking-price {
            font-size: 11px;
            color: #D42222;
            font-weight: 600;
        }
        .mh-waterfall {
            padding: 8px 12px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, fit-content(100%));
            gap: 8px;
        }
        .mh-product-card {
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 0 8px 0 rgba(0, 0, 0, 0.04);
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .mh-product-img {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #E0E0E0;
            border-radius: 8px 8px 0 0;
            position: relative;
            background-size: cover;
            background-position: center;
        }
        .mh-product-img .mh-product-badge {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.4);
            color: #FFFFFF;
            font-size: 10px;
            padding: 2px 4px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .mh-product-body {
            padding: 8px 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .mh-product-title {
            font-size: 13px;
            color: #1D1D1D;
            line-height: 1.4;
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .mh-product-tags {
            display: flex;
            gap: 4px;
            margin-bottom: 4px;
        }
        .mh-product-tag {
            font-size: 10px;
            padding: 1px 4px;
            border-radius: 2px;
            background: #F0BCBC;
            color: #D42222;
        }
        .mh-product-tag.gray {
            background: #F3F4F6;
            color: #828282;
        }
        .mh-product-price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 16px;
        }
        .mh-product-price {
            color: #D42222;
            font-size: 16px;
            font-weight: 600;
        }
        .mh-product-price .mh-original {
            color: #BDBDBD;
            font-size: 11px;
            text-decoration: line-through;
            margin-left: 4px;
            font-weight: 400;
        }
        .mh-product-cart {
            width: 24px;
            height: 24px;
            background: #353B3C;
            color: #FFFFFF;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .mh-fab {
            position: absolute;
            right: 24px;
            bottom: 96px;
            width: 48px;
            height: 48px;
            background: #353B3C;
            color: #FFFFFF;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 8px 0 rgba(22, 22, 22, 0.08);
            cursor: pointer;
            z-index: 10;
        }
        .mh-fab .mh-fab-badge {
            position: absolute;
            top: -3px;
            right: -16px;
            width: 16px;
            height: 17px;
            background: #F24333;
            color: #FFFFFF;
            font-size: 10px;
            border: 1px solid #FFFFFF;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .mobile-bottom-nav {
            background: #FFFFFF;
            border-top: 0.5px solid #E5E5E5;
            flex-shrink: 0;
        }

        .nav-tabs {
            height: 56px;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            padding-top: 8px;
        }

        .nav-home-indicator {
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ios-home-indicator {
            width: 134px;
            height: 5px;
            background: #1C1C1E;
            border-radius: 3px;
            opacity: 0.8;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 11px;
            font-weight: 500;
            font-family: 'PingFang SC', -apple-system, sans-serif;
            line-height: 16px;
            text-align: center;
            color: var(--gray4);
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item img {
            width: 28px;
            height: 28px;
        }
        
        .description-panel {
            width: 460px;
            min-width: 460px;
            background: var(--white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100vh;
            flex-shrink: 0;
            border-left: 1px solid var(--border);
        }

        .panel-header {
            padding: 20px 24px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .panel-header .anno-file {
            font-size: 11px;
            color: var(--gray4);
            font-family: var(--font-mono);
            margin-bottom: 4px;
        }

        .panel-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: #111;
            letter-spacing: 0.2px;
        }

        .panel-header .anno-page-desc {
            font-size: 12px;
            color: var(--gray3);
            margin-top: 3px;
            line-height: 1.5;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--white);
            padding: 0 24px;
            flex-shrink: 0;
        }

        .panel-tab {
            padding: 11px 0;
            margin-right: 24px;
            font-size: 13px;
            cursor: pointer;
            color: var(--gray3);
            border-bottom: 2px solid transparent;
            transition: all 0.15s;
            white-space: nowrap;
            font-weight: 500;
        }

        .panel-tab:hover:not(.active) {
            color: var(--gray1);
        }

        .panel-tab.active {
            color: var(--gray1);
            border-bottom-color: var(--gray1);
            font-weight: 600;
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 32px;
        }

        .panel-content::-webkit-scrollbar { width: 4px; }
        .panel-content::-webkit-scrollbar-thumb { background: var(--gray5); border-radius: 2px; }
        .panel-content::-webkit-scrollbar-track { background: transparent; }

        .doc-section {
            margin-bottom: 24px;
        }

        .doc-section-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--gray4);
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .doc-section p {
            font-size: 13px;
            line-height: 1.8;
            color: var(--gray2);
            margin-bottom: 8px;
        }

        .doc-section ul {
            list-style: none;
            padding-left: 0;
        }

                                        </div>
                                    </div>
                                    ${s.showBell ? `<div class="ph-nav-accessory"><img src="figma-images/icon-bell.svg" alt=""></div>` : ''}
                                </div>
                            </div>
                            <div class="ph-member-card" data-block="member-card">
                                <div class="ph-member-top">
                                    <div class="ph-member-level">
                                        ${s.levelName ? `<span class="ph-level-name">${s.levelName}</span>` : ''}
                                        ${s.showTag ? `<span class="ph-level-tag"><img src="figma-images/icon-v1-tag.svg" alt="">${s.tagText}</span>` : ''}
                                        ${s.levelText ? `<span class="ph-level-name is-gray">${s.levelText}</span>` : ''}
                                    </div>
                                    <div class="ph-member-link">会员中心 ${arrow}</div>
                                </div>
                                <div class="ph-member-stats">
                                    <div class="ph-stat-item">
                                        <div class="ph-stat-value"><span class="ph-stat-num">${s.points}</span><span class="ph-stat-unit">分</span></div>
                                        <div class="ph-stat-label">积分</div>
                                    </div>
                                    <div class="ph-stat-item">
                                        <div class="ph-stat-value"><span class="ph-stat-num">${s.balance}</span><span class="ph-stat-unit">元</span></div>
                                        <div class="ph-stat-label">回馈金</div>
                                    </div>
                                    <div class="ph-stat-item">
                                        <div class="ph-stat-value"><span class="ph-stat-num">${s.coupons}</span><span class="ph-stat-unit">张</span></div>
                                        <div class="ph-stat-label">优惠券</div>
                                    </div>
                                </div>
                            </div>
                            ${s.showLivingCard ? `
                            <div class="ph-living-card" data-block="living-card">
                                <div class="ph-living-card-title"><img src="figma-images/living-card-title.svg" alt="徕芙社区卡"></div>
                                ${s.livingCardExpiry ? `<div class="ph-living-card-expiry">${s.livingCardExpiry}</div>` : ''}
                                ${s.livingCardSubtitle ? `<div class="ph-living-card-subtitle">${s.livingCardSubtitle}</div>` : ''}
                                ${s.livingCardCta ? `<div class="ph-living-card-cta">${s.livingCardCta}</div>` : ''}
                                <div class="ph-living-card-features">${livingCardFeatureHTML}</div>
                            </div>
                            ` : ''}
                            <div class="ph-card" data-block="orders">
                                <div class="ph-card-title-row">
                                    <div class="ph-card-title">我的订单</div>
                                    <div class="ph-card-more">全部订单 ${arrow}</div>
                                </div>
                                <div class="ph-grid-row">${orderIcons.map(gridItem).join('')}</div>
                            </div>
                            <div class="ph-card" data-block="services">
                                <div class="ph-card-title-row">
                                    <div class="ph-card-title">物业服务</div>
                                </div>
                                <div class="ph-grid-row">${serviceIcons.map(gridItem).join('')}</div>
                                <div class="ph-grid-row">${serviceIcons2.map(gridItem).join('')}</div>
                            </div>
                            <div style="height: 16px;"></div>
                        </div>
                    `;
                };

                return `
                    <div class="ph-page">
                        ${Object.keys(states).map((k, i) => renderState(k, i)).join('')}
                    </div>
                `;
            }
        };

        // ====== 渲染后事件绑定 ======
        function bindPageEvents(pageId) {
            if (pageId === 'shop-home') {
                const fab = document.querySelector('#mobile-content .mh-fab');
                if (fab) {
                    fab.addEventListener('click', () => switchPage('shop-cart'));
                }
                document.querySelectorAll('#mobile-content .mh-cat-item').forEach(el => {
                    el.addEventListener('click', () => switchPage('shop-category'));
                });
                document.querySelectorAll('#mobile-content .mh-product-card').forEach(el => {
                    el.addEventListener('click', () => switchPage('shop-detail'));
                });
                document.querySelectorAll('#mobile-content .mh-search-bar').forEach(el => {
                    el.addEventListener('click', () => switchPage('shop-search'));
                });
            }
            if (pageId === 'profile-home') {
                // 外部状态控制器切换
                document.querySelectorAll('#state-controller .state-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        const state = tab.dataset.state;
                        applyProfileState(state);
                        // 同步状态到 URL hash
                        const cur = getPageIdFromHash();
                        if (cur && cur.startsWith('profile-home')) {
                            history.replaceState(null, '', '#profile-home:' + state);
                        }
                    });
                });
                // 根据 hash 中的状态初始化
                const initState = getStateFromHash();
                if (initState) applyProfileState(initState);
            }
        }

        // 应用个人中心会员状态到控制器与原型
        function applyProfileState(state) {
            const tab = document.querySelector(`#state-controller .state-tab[data-state="${state}"]`);
            if (!tab) return;
            document.querySelectorAll('#state-controller .state-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('#mobile-content .ph-state-panel').forEach(p => {
                p.classList.toggle('active', p.dataset.state === state);
            });
            const content = document.getElementById('mobile-content');
            if (content) content.scrollTop = 0;
        }

        // ====== 渲染：交互注释 ======
        function renderInteractionNotes(notes) {
            if (!notes || notes.length === 0) return '<p style="color:#999;font-size:12px;">暂无交互注释</p>';
            return `
                <div class="interaction-list">
                    ${notes.map(note => {
                        const lines = note.content.split('\n').map(line => {
                            if (!line.trim()) return '';
                            // 子项：以 "  · " 开头
                            if (/^\s*·\s/.test(line)) {
                                return `<div class="note-line sub">${line.replace(/^\s*·\s/, '')}</div>`;
                            }
                            // 标签行：以"："结尾且短（如"结构："）
                            if (/^[^：]{1,8}：$/.test(line.trim())) {
                                return `<div class="note-line label">${line.trim()}</div>`;
                            }
                            return `<div class="note-line">${line}</div>`;
                        }).join('');
                        return `
                            <div class="interaction-card${note.target ? ' has-target' : ''}"${note.target ? ` data-target="${note.target}"` : ''}>
                                <div class="interaction-card-header">
                                    <span class="interaction-num">${note.id}</span>
                                    <span class="interaction-title">${note.title}</span>
                                    <span class="interaction-tag ${note.type}">${note.type === 'interaction' ? '交互' : '状态'}</span>
                                </div>
                                <div class="interaction-content">
                                    ${lines}
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
        
        // ====== 渲染：需求文档 ======
        function renderRequirementDoc(doc) {
            if (!doc) return '<p style="color:#999;font-size:12px;">暂无需求文档</p>';
            return `
                <div class="prd-header">
                    <div class="prd-title">${doc.title}</div>
                    <div class="prd-meta">${doc.meta}</div>
                </div>
                ${doc.sections.map(section => `
                    <div class="prd-section">
                        <div class="prd-section-title">${section.title}</div>
                        ${section.paragraphs ? section.paragraphs.map(p => `<p>${p}</p>`).join('') : ''}
                        ${section.flow ? `<div class="prd-flow">${section.flow}</div>` : ''}
                        ${section.table ? renderTable(section.table) : ''}
                        ${section.code ? `<pre class="prd-code">${section.code}</pre>` : ''}
                        ${section.warn ? `<div class="prd-warn">${section.warn}</div>` : ''}
                    </div>
                `).join('')}
            `;
        }
        
        function renderTable(table) {
            return `
                <table class="prd-table">
                    <thead>
                        <tr>${table.headers.map(h => `<th>${h}</th>`).join('')}</tr>
                    </thead>
                    <tbody>
                        ${table.rows.map(row => `
                            <tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        // ====== 渲染：状态清单 ======
        function renderStatusList(list) {
            if (!list || list.length === 0) return '<p style="color:#999;font-size:12px;">暂无状态清单</p>';
            return `
                <table class="status-table">
                    <thead>
                        <tr>
                            <th>区块</th>
                            <th>状态</th>
                            <th>触发条件</th>
                            <th>UI 表现</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${list.map(item => `
                            <tr>
                                <td class="block-name">${item.block}</td>
                                <td>${item.state}</td>
                                <td>${item.trigger}</td>
                                <td class="ui-cell">${item.ui}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        // ====== 切换页面 ======
        function switchPage(pageId) {
            const page = pages[pageId];
            if (!page) return;
            
            document.querySelectorAll('.menu-item[data-subpage]').forEach(item => item.classList.remove('active'));
            document.querySelectorAll(`[data-subpage="${pageId}"]`).forEach(item => item.classList.add('active'));
            
            document.querySelectorAll('.page-tab').forEach(tab => tab.classList.remove('active'));
            const matchedTabs = document.querySelectorAll(`[data-tab="${pageId}"]`);
            matchedTabs.forEach(tab => tab.classList.add('active'));
            // 当前页面无对应 tab 时隐藏整组 page-tabs
            const pageTabsEl = document.getElementById('page-tabs');
            pageTabsEl.style.display = matchedTabs.length > 0 ? 'flex' : 'none';

            // 状态控制器：仅 profile-home 显示
            const stateCtrl = document.getElementById('state-controller');
            stateCtrl.style.display = pageId === 'profile-home' ? 'flex' : 'none';
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
                const icon = item.getAttribute('data-icon');
                const img = item.querySelector('img');
                if (img && icon) img.src = `figma-images/${icon}.svg`;
            });
            document.querySelectorAll(`[data-nav="${page.mainNav}"]`).forEach(item => {
                item.classList.add('active');
                const icon = item.getAttribute('data-icon');
                const img = item.querySelector('img');
                if (img && icon) img.src = `figma-images/${icon}-active.svg`;
            });
            
            document.getElementById('breadcrumb-main').textContent = 
                page.mainNav === 'shop' ? '商城' : 
                page.mainNav === 'access' ? '通行页' : '我的页';
            document.getElementById('breadcrumb-sub').textContent = page.title;
            
            document.getElementById('mobile-title').textContent = page.title;
            document.getElementById('panel-title').textContent = page.title;

            // 个人中心无标准导航栏（顶部直接是背景图）
            document.querySelector('.mobile-header').style.display = (pageId === 'profile-home') ? 'none' : 'flex';
            // 个人中心：状态栏叠加在背景图上（透明背景、白色文字）
            document.querySelector('.mobile-status-bar').classList.toggle('profile', pageId === 'profile-home');
            
            // 优先使用自定义渲染函数，否则使用 placeholder
            const renderFn = pageRenderers[page.render];
            const contentEl = document.getElementById('mobile-content');
            if (renderFn) {
                contentEl.classList.add('custom-render');
                contentEl.innerHTML = renderFn();
                // 渲染后绑定交互
                if (typeof bindPageEvents === 'function') bindPageEvents(pageId);
            } else {
                contentEl.classList.remove('custom-render');
                const placeholder = page.placeholder;
                contentEl.innerHTML = `
                    <div class="page-placeholder">
                        <i class="${placeholder.icon}"></i>
                        <h3>${placeholder.title}</h3>
                        <p>${placeholder.desc}</p>
                    </div>
                `;
            }
            
            // 切换页面时清除残留的注释选中态与原型高亮
            document.querySelectorAll('.interaction-card.selected').forEach(c => c.classList.remove('selected'));
            document.querySelectorAll('.ph-highlight').forEach(el => el.classList.remove('ph-highlight'));

            document.getElementById('panel-interaction').innerHTML = renderInteractionNotes(page.interactionNotes);
            document.getElementById('panel-requirement').innerHTML = renderRequirementDoc(page.requirementDoc);
            document.getElementById('panel-status').innerHTML = renderStatusList(page.statusList);
        }
        
        function switchPanel(panelName) {
            document.querySelectorAll('.panel-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll(`[data-panel="${panelName}"]`).forEach(tab => tab.classList.add('active'));
            
            document.querySelectorAll('.panel-section').forEach(section => section.style.display = 'none');
            document.getElementById(`panel-${panelName}`).style.display = 'block';
        }
        
        // ====== 事件绑定 ======
        document.querySelectorAll('.menu-item[data-subpage]').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                switchPage(item.dataset.subpage);
            });
        });
        
        document.querySelectorAll('.page-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                switchPage(tab.dataset.tab);
            });
        });
        
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                const pageMap = { 'shop': 'shop-home', 'access': 'access-home', 'profile': 'profile-home' };
                switchPage(pageMap[item.dataset.nav]);
            });
        });
        
        document.querySelectorAll('.panel-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                switchPanel(tab.dataset.panel);
            });
        });

        // 交互注释卡片：点击高亮原型对应模块，再次点击取消
        document.getElementById('panel-interaction').addEventListener('click', (e) => {
            const card = e.target.closest('.interaction-card.has-target');
            if (!card) return;
            const targetSel = card.dataset.target;
            if (!targetSel) return;
            const wasSelected = card.classList.contains('selected');
            // 清除所有选中态与高亮
            document.querySelectorAll('.interaction-card.selected').forEach(c => c.classList.remove('selected'));
            document.querySelectorAll('.ph-highlight').forEach(el => el.classList.remove('ph-highlight'));
            if (!wasSelected) {
                card.classList.add('selected');
                document.querySelectorAll(targetSel).forEach(el => el.classList.add('ph-highlight'));
            }
        });
        
        document.querySelectorAll('.menu-item.expandable').forEach(item => {
            item.addEventListener('click', (e) => {
                e.stopPropagation();
                const subMenu = item.nextElementSibling;
                const isExpanded = item.classList.contains('expanded');
                
                if (isExpanded) {
                    item.classList.remove('expanded');
                    if (subMenu && subMenu.classList.contains('sub-menu')) {
                        subMenu.classList.remove('expanded');
                    }
                } else {
                    item.classList.add('expanded');
                    if (subMenu && subMenu.classList.contains('sub-menu')) {
                        subMenu.classList.add('expanded');
                    }
                    const page = item.dataset.page;
                    if (page) {
                        const pageMap = { 'shop': 'shop-home', 'access': 'access-home', 'profile': 'profile-home' };
                        switchPage(pageMap[page]);
                    }
                }
            });
        });
        
        function expandParentMenu(pageId) {
            const subMenuItem = document.querySelector(`[data-subpage="${pageId}"]`);
            if (subMenuItem) {
                const subMenu = subMenuItem.closest('.sub-menu');
                if (subMenu) {
                    subMenu.classList.add('expanded');
                    const expandableItem = subMenu.previousElementSibling;
                    if (expandableItem && expandableItem.classList.contains('expandable')) {
                        expandableItem.classList.add('expanded');
                    }
                }
            }
        }
        
        const _originalSwitchPage = switchPage;
        switchPage = function(pageId, opts = {}) {
            expandParentMenu(pageId);
            _originalSwitchPage(pageId);
            // 同步 URL hash（opts.fromHash 表示由 hashchange 触发，避免循环）
            if (!opts.fromHash && pageId !== getPageIdFromHash()) {
                history.replaceState(null, '', '#' + pageId);
            }
        };

        // 从 URL hash 解析页面 ID（去掉 :state 状态后缀）
        function getPageIdFromHash() {
            const hash = window.location.hash.replace(/^#/, '');
            if (!hash) return null;
            return hash.split(':')[0];
        }
        // 从 URL hash 解析附加状态（如个人中心会员状态）
        function getStateFromHash() {
            const hash = window.location.hash.replace(/^#/, '');
            const idx = hash.indexOf(':');
            return idx >= 0 ? hash.slice(idx + 1) : null;
        }

        // 监听浏览器前进/后退，同步页面
        window.addEventListener('hashchange', () => {
            const pageId = getPageIdFromHash();
            if (pageId && pages[pageId]) {
                switchPage(pageId, { fromHash: true });
            }
        });

        // ====== 初始化：根据 URL hash 渲染对应页面，默认商城首页 ======
        const initialPage = getPageIdFromHash();
        switchPage(initialPage && pages[initialPage] ? initialPage : 'shop-home');
    </script>
</body>
</html>
